<svg viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" font-family="'Nunito','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6ef4" />
      <stop offset="100%" stop-color="#3f8cff" />
    </linearGradient>
  </defs>

  <rect width="850" height="1100" fill="#ffffff" />

  <!-- Header band -->
  <rect width="850" height="330" fill="url(#headerGrad)" />
  <circle cx="90" cy="80" r="26" fill="#ffffff" opacity="0.12" />
  <circle cx="65" cy="45" r="9" fill="#ffffff" opacity="0.12" />
  <circle cx="118" cy="45" r="9" fill="#ffffff" opacity="0.12" />
  <circle cx="55" cy="95" r="7" fill="#ffffff" opacity="0.12" />
  <circle cx="128" cy="95" r="7" fill="#ffffff" opacity="0.12" />

  <circle cx="760" cy="260" r="34" fill="#ffffff" opacity="0.1" />
  <circle cx="725" cy="215" r="12" fill="#ffffff" opacity="0.1" />
  <circle cx="795" cy="215" r="12" fill="#ffffff" opacity="0.1" />
  <circle cx="710" cy="270" r="9" fill="#ffffff" opacity="0.1" />
  <circle cx="810" cy="270" r="9" fill="#ffffff" opacity="0.1" />

  <text x="425" y="120" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="3">YOU'RE INVITED</text>

  <!-- Simple dog silhouette -->
  <g transform="translate(425,205)" fill="#ffffff">
    <ellipse cx="0" cy="35" rx="72" ry="46" />
    <circle cx="-58" cy="-8" r="34" />
    <ellipse cx="-82" cy="-34" rx="14" ry="22" transform="rotate(-25 -82 -34)" />
    <ellipse cx="-34" cy="-34" rx="14" ry="22" transform="rotate(25 -34 -34)" />
    <circle cx="-70" cy="-6" r="4" fill="#1a6ef4" />
    <ellipse cx="-44" cy="0" rx="6" ry="4" fill="#1a6ef4" />
  </g>

  <text x="425" y="300" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">Meet dogs looking for their forever home</text>

  <!-- Title -->
  <text x="425" y="410" text-anchor="middle" fill="#1f2937" font-size="52" font-weight="800">Friday Adoption</text>
  <text x="425" y="470" text-anchor="middle" fill="#1f2937" font-size="52" font-weight="800">Meet-and-Greet</text>

  <line x1="225" y1="510" x2="625" y2="510" stroke="#e5e7eb" stroke-width="2" />

  <!-- Info block -->
  <g font-size="24" fill="#374151" font-weight="600">
    <text x="425" y="570" text-anchor="middle">Every Friday · 5:00 – 7:00 PM</text>
    <text x="425" y="608" text-anchor="middle">123 Main St, Example City, ST</text>
  </g>

  <!-- Highlights -->
  <g font-size="20" fill="#4b5563">
    <circle cx="255" cy="675" r="5" fill="#1a6ef4" />
    <text x="275" y="682">Meet-and-greet with adoptable dogs</text>

    <circle cx="255" cy="715" r="5" fill="#1a6ef4" />
    <text x="275" y="722">Volunteer Q&amp;A table</text>

    <circle cx="255" cy="755" r="5" fill="#1a6ef4" />
    <text x="275" y="762">Family-friendly event — all ages welcome</text>
  </g>

  <!-- Footer CTA band -->
  <rect x="0" y="960" width="850" height="140" fill="#7cb518" />
  <text x="425" y="1015" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">No RSVP needed — just come by!</text>
  <text x="425" y="1055" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="500" opacity="0.9">example.org/register/adoption-fridays</text>
</svg>
